              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Das europäische Recht auf Reparatur (Richtlinie (EU) 2024/1799) verpflichtet Hersteller dazu, Reparaturen für typische Konsumgüter auch nach Ablauf der gesetzlichen Garantie zu angemessenen Preisen und Fristen anzubieten. Zudem verlängert eine Reparatur innerhalb der 2-jährigen Gewährleistung die Frist der Sachmängelhaftung um weitere 12 Monate, und Software-Sperren (Part-Pairing) gegen unabhängige Werkstätten werden verboten."

              "@type": "Question",
              "name": "Ab wann gilt das Recht auf Reparatur in Deutschland?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die Richtlinie (EU) 2024/1799 ist Mitte 2024 in Kraft getreten. Die EU-Mitgliedstaaten, einschließlich Deutschland, setzen die Vorgaben bis Sommer 2026 in nationales Recht um. Viele produktbezogene Ökodesign-Pflichten für Ersatzteile (z. B. für Smartphones, Tablets, Waschmaschinen und Kühlschränke) gelten bereits jetzt verbindlich."
              }
            },
            {
              "@type": "Question",
              "name": "Welche Geräte fallen unter das Recht auf Reparatur?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Zu den abgedeckten Produktgruppen gehören Smartphones, Tablets, Waschmaschinen, Haushalts-Wäschetrockner, Geschirrspüler, Kühl- und Gefriergeräte, Fernseher und Displays, Schweißgeräte sowie Staubsauger. Die EU-Kommission erweitert den Katalog im Rahmen der Ökodesign-Verordnung (ESPR) kontinuierlich."
              }
            },
            {
              "@type": "Question",
              "name": "Haben Verbraucher in Deutschland eine rechtliche Pflicht zur Reparatur?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nein. Verbraucher sind gesetzlich nicht verpflichtet, defekte Geräte reparieren zu lassen. Der Begriff bezieht sich primär auf die Pflichten der Hersteller (Bereitstellung von Ersatzteilen über 7 bis 10 Jahre, Reparaturanleitungen, diskriminierungsfreier Zugang für freie Werkstätten)."
              }
