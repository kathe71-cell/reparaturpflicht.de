<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Inner Card -->
  <rect x="120" y="90" width="960" height="450" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.05))" />

  <!-- Top Badge -->
  <rect x="180" y="140" width="340" height="36" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="350" y="163" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#047857" letter-spacing="1">EU-RICHTLINIE 2024/1799</text>

  <!-- Main Title -->
  <text x="180" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
    Recht auf Reparatur 2026
  </text>

  <!-- Subtitle -->
  <text x="180" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#334155">
    Herstellerpflichten, Ersatzteil-Garantie &amp; Reparaturbonus
  </text>

  <text x="180" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#64748b">
    7–10 Jahre Ersatzteilpflicht für Haushaltsgeräte &amp; Elektronik in Deutschland
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="110" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">✓ Pflichten-Check</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="240" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="355" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">✓ Ersparnis-Rechner</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="240" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="610" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">✓ Bundesländer-Bonus</text>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="180" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
    https://reparaturpflicht.de · Unabhängiges Informationsportal
  </text>
</svg>
