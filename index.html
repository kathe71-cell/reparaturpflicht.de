              "@type": "Question",
              "name": "Haben Verbraucher in Deutschland eine rechtliche Pflicht zur Reparatur?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nein. Verbraucher sind gesetzlich nicht verpflichtet, ihre defekten Geräte reparieren zu lassen. Der Begriff 'Reparaturpflicht' bezieht sich primär auf die Pflichten der Hersteller und Inverkehrbringer (z. B. Bereitstellung von Ersatzteilen über 7 bis 10 Jahre, Reparaturanleitungen, Verbot von Software-Sperren) sowie auf den Vorrang der Nachbesserung im Rahmen der gesetzlichen Sachmängelhaftung."
              }
            },
            {
              "@type": "Question",
              "name": "Welche Neuerungen bringt die EU-Richtlinie zum Recht auf Reparatur (2024/1799)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die Richtlinie (EU) 2024/1799 verpflichtet Hersteller dazu, Reparaturen auch nach Ablauf der 2-jährigen gesetzlichen Gewährleistung zu angemessenen Preisen und binnen angemessener Frist anzubieten. Zudem wird bei einer Reparatur innerhalb der Gewährleistung die Frist der Sachmängelhaftung um 12 Monate verlängert."
              }
            },
            {
              "@type": "Question",
              "name": "Wie lange müssen Hersteller Ersatzteile für Haushaltsgeräte bereithalten?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Gemäß den EU-Ökodesign-Vorgaben müssen Hersteller von Waschmaschinen, Geschirrspülern und Kühlgeräten wichtige Ersatzteile in der Regel 7 bis 10 Jahre nach dem Inverkehrbringen des letzten Exemplars vorrätig halten. Die maximale Lieferfrist beträgt gesetzlich 10 bis 15 Arbeitstage."
              }
            },

              "@type": "Question",
              "name": "Was ist der staatliche Reparaturbonus und wo kann er beantragt werden?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Der Reparaturbonus ist ein staatliches Förderprogramm, bei dem 50 Prozent der Reparaturkosten (meist bis zu maximal 200 Euro pro Reparatur und Kalenderjahr) erstattet werden. Bundesländer wie Thüringen, Sachsen und Berlin haben bereits erfolgreiche Programme etabliert; eine bundesweite Ausweitung ist in der politischen Umsetzung."
