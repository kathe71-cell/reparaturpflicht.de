              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die gesetzliche Gewährleistung (Sachmängelhaftung nach § 437 BGB) richtet sich ausschließlich gegen den Verkäufer (Händler) und gilt 2 Jahre ab Übergabe der Ware bei Mängeln, die bei Gefahrübergang vorlagen. Die Ökodesign-Ersatzteilpflicht verpflichtet den Hersteller/Importeur, Ersatzteile über 7 bis 10 Jahre bereitbehalten."
              }
